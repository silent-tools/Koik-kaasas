<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kõik kaasas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kõik kaasas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="koik-kaasas-ikoon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, app-like; big tap rows; lemmikud on top as solid rows, theirs is the only accent */
:root{
  --bg:#EEF1F4; --card:#FFFFFF; --fg:#16202B; --muted:#5B6878; --line:#D5DCE4;
  --accent:#1D57B8; --accent-fg:#FFFFFF; --star:#E0A100; --ok:#1E7A4C; --ok-bg:#E2F3E9; --danger:#B3261E;
  --font:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --card:#18212B; --fg:#E8EDF2; --muted:#9AA7B5; --line:#2A3542;
  --accent:#6E9EF0; --accent-fg:#0B1220; --star:#F2C14E; --ok:#5CC98E; --ok-bg:#16301F; --danger:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --card:#18212B; --fg:#E8EDF2; --muted:#9AA7B5; --line:#2A3542;
  --accent:#6E9EF0; --accent-fg:#0B1220; --star:#F2C14E; --ok:#5CC98E; --ok-bg:#16301F; --danger:#F08A82; color-scheme:dark}

html{font:-apple-system-body;font-size:max(17px,1em)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.05rem;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

header{display:flex;align-items:center;gap:10px;min-height:52px}
header h1{font-size:1.6rem;margin:0;flex:1;min-width:0;text-wrap:balance;overflow-wrap:anywhere}
.iconbtn{min-width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;color:var(--fg)}
.iconbtn:active{background:var(--line)}
.label{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 4px 0}

.group{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;text-align:left;padding:8px 0;display:flex;flex-direction:column;gap:2px}
.row .name{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.star{font-size:1.5rem;color:var(--muted)}
.star.on{color:var(--star)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px;max-width:160px}
.bar i{display:block;height:100%;background:var(--ok)}

.btn{min-height:52px;border-radius:12px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn.danger{color:var(--danger);border:1px solid var(--danger);background:var(--card)}
.btn.danger.armed{background:var(--danger);color:var(--card)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}

.item{display:flex;align-items:center;gap:14px;min-height:62px;padding:6px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.group .item:first-child{border-top:0}
.box{flex:none;width:32px;height:32px;border-radius:9px;border:2px solid var(--muted);display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:transparent}
.item.done .box{background:var(--ok);border-color:var(--ok);color:var(--card)}
.item .t{flex:1;min-width:0;font-size:1.15rem;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.edititem{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-top:1px solid var(--line)}
.group .edititem:first-child{border-top:0}
.edititem input{flex:1;min-width:0}
input[type=text]{min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:1.05rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0}

.status{border-radius:14px;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.status.progress{background:var(--card);border:1px solid var(--line)}
.status.complete{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.empty{color:var(--muted);padding:18px 16px}
.note{color:var(--muted);font-size:.9rem}
textarea{width:100%;box-sizing:border-box;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:inherit;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .2s}.box{transition:background .12s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
const KEY='koik-kaasas-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){return{lists:[
  {id:uid(),name:'Tööleminek',fav:true,items:['Töövõti','Telefon','Arvuti','Arvuti laadija','Rahakott','Lõunasöök'].map(t=>({id:uid(),text:t,done:false}))},
  {id:uid(),name:'Padeli trenn',fav:false,items:['Reket','Pallid','Padeli jalanõud','Rätik','Veepudel','Vahetusriided'].map(t=>({id:uid(),text:t,done:false}))}
]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.lists))S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let view={name:'home'}; // home | list | edit | new | backup
let armed=null;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName=(a,b)=>a.name.localeCompare(b.name,'et');
const L=id=>S.lists.find(l=>l.id===id);

function listRow(l){
  const n=l.items.length,d=l.items.filter(i=>i.done).length;
  return `<div class="row">
    <button class="main" data-open="${l.id}">
      <span class="name">${esc(l.name)}</span>
      <span class="meta">${n?`${d}/${n} märgitud`:'Tühi nimekiri'}</span>
      ${n?`<span class="bar"><i style="width:${Math.round(d/n*100)}%"></i></span>`:''}
    </button>
    <button class="iconbtn star ${l.fav?'on':''}" data-fav="${l.id}" aria-label="${l.fav?'Eemalda lemmikutest':'Lisa lemmikuks'}">${l.fav?'★':'☆'}</button>
  </div>`;
}

function render(){
  armed=null;
  if(view.name==='home'){
    const favs=S.lists.filter(l=>l.fav).sort(byName), rest=S.lists.filter(l=>!l.fav).sort(byName);
    app.innerHTML=`<header><h1>Kõik kaasas</h1><button class="iconbtn" data-go="backup" aria-label="Varukoopia">⋯</button></header>
      ${favs.length?`<div class="label">Lemmikud</div><div class="group">${favs.map(listRow).join('')}</div>`:''}
      <div class="label">${favs.length?'Teised nimekirjad':'Nimekirjad'}</div>
      <div class="group">${rest.length?rest.map(listRow).join(''):`<div class="empty">${S.lists.length?'Kõik nimekirjad on lemmikud.':'Nimekirju pole veel. Lisa esimene allpool.'}</div>`}</div>
      <button class="btn primary" data-go="new">＋ Uus nimekiri</button>
      ${!favs.length&&S.lists.length?'<p class="note">Vajuta ☆, et nimekiri ülesse lemmikuks tõsta.</p>':''}`;
  }
  else if(view.name==='list'){
    const l=L(view.id); if(!l){view={name:'home'};return render()}
    const n=l.items.length,d=l.items.filter(i=>i.done).length;
    app.innerHTML=`<header><button class="iconbtn" data-go="home" aria-label="Tagasi">‹</button><h1>${esc(l.name)}</h1>
      <button class="iconbtn star ${l.fav?'on':''}" data-fav="${l.id}" aria-label="Lemmik">${l.fav?'★':'☆'}</button></header>
      ${n?`<div class="status ${d===n?'complete':'progress'}"><span>${d===n?'Kõik kaasas ✓':'Veel võtta: '+(n-d)}</span><span>${d}/${n}</span></div>`:''}
      <div class="group">${n?l.items.map(i=>`<button class="item ${i.done?'done':''}" data-tick="${i.id}" role="checkbox" aria-checked="${i.done}"><span class="box">✓</span><span class="t">${esc(i.text)}</span></button>`).join(''):'<div class="empty">Nimekiri on tühi. Vajuta „Muuda”, et asju lisada.</div>'}</div>
      <div class="btns"><button class="btn primary" data-reset ${d?'':'disabled style="opacity:.45"'}>↺ Alusta uuesti</button><button class="btn ghost" data-go="edit">Muuda</button></div>`;
  }
  else if(view.name==='edit'){
    const l=L(view.id);
    app.innerHTML=`<header><button class="iconbtn" data-done-edit aria-label="Valmis">‹</button><h1>Muuda</h1><button class="btn primary" data-done-edit style="min-height:44px">Valmis</button></header>
      <div class="label">Nimi</div>
      <input type="text" id="lname" value="${esc(l.name)}" aria-label="Nimekirja nimi">
      <div class="label">Asjad</div>
      <div class="group">${l.items.map((i,k)=>`<div class="edititem">
        <input type="text" id="it-${i.id}" data-itext="${i.id}" value="${esc(i.text)}" aria-label="Asi">
        <button class="iconbtn" data-up="${i.id}" aria-label="Ülesse" ${k?'':'disabled style="opacity:.3"'}>↑</button>
        <button class="iconbtn" data-del="${i.id}" aria-label="Kustuta" style="color:var(--danger)">✕</button></div>`).join('')||'<div class="empty">Veel pole midagi.</div>'}</div>
      <form class="addrow" id="addf"><input type="text" id="newitem" placeholder="Lisa asi, nt Võtmed" autocomplete="off"><button class="btn primary" aria-label="Lisa">＋</button></form>
      <div class="label">Nimekiri</div>
      <div class="btns"><button class="btn ghost" data-copy>Kopeeri nimekiri</button><button class="btn danger" id="dellist">Kustuta nimekiri</button></div>`;
  }
  else if(view.name==='new'){
    app.innerHTML=`<header><button class="iconbtn" data-go="home" aria-label="Tagasi">‹</button><h1>Uus nimekiri</h1></header>
      <form id="newf" style="display:flex;flex-direction:column;gap:12px">
      <input type="text" id="newname" placeholder="Nt Ujumine, Reis, Kalale" autocomplete="off" aria-label="Nimi">
      <button class="btn primary">Loo nimekiri</button></form>`;
    setTimeout(()=>document.getElementById('newname').focus(),50);
  }
  else if(view.name==='backup'){
    app.innerHTML=`<header><button class="iconbtn" data-go="home" aria-label="Tagasi">‹</button><h1>Varukoopia</h1></header>
      <p class="note">Nimekirjad on salvestatud ainult selle telefoni brauserisse. Kui brauseri andmed kustutatakse, kaovad ka need. Kopeeri tekst aeg-ajalt nt Märkmetesse.</p>
      <textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea>
      <button class="btn ghost" id="copybk">Kopeeri varukoopia</button>
      <div class="label">Taasta</div>
      <textarea id="rs" placeholder="Kleebi varukoopia tekst siia"></textarea>
      <button class="btn danger" id="restore">Taasta varukoopiast</button>
      <p class="note" id="msg"></p>`;
  }
}

function syncEdit(){
  if(view.name!=='edit')return;
  const l=L(view.id); const nm=document.getElementById('lname').value.trim(); if(nm)l.name=nm;
  document.querySelectorAll('[data-itext]').forEach(inp=>{const it=l.items.find(i=>i.id===inp.dataset.itext);if(it&&inp.value.trim())it.text=inp.value.trim()});
}

app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  const ds=t.dataset;
  if(ds.open){view={name:'list',id:ds.open};return render()}
  if(ds.fav){const l=L(ds.fav);l.fav=!l.fav;save();return render()}
  if(ds.go){if(ds.go==='edit')view={name:'edit',id:view.id};else view={name:ds.go};return render()}
  if(ds.tick){const l=L(view.id),it=l.items.find(i=>i.id===ds.tick);it.done=!it.done;save();return render()}
  if('reset' in ds){L(view.id).items.forEach(i=>i.done=false);save();return render()}
  if('doneEdit' in ds){syncEdit();save();view={name:'list',id:view.id};return render()}
  if(ds.del){syncEdit();const l=L(view.id);l.items=l.items.filter(i=>i.id!==ds.del);save();return render()}
  if(ds.up){syncEdit();const l=L(view.id),k=l.items.findIndex(i=>i.id===ds.up);if(k>0){[l.items[k-1],l.items[k]]=[l.items[k],l.items[k-1]]}save();return render()}
  if('copy' in ds){syncEdit();const l=L(view.id);const c={id:uid(),name:l.name+' (koopia)',fav:false,items:l.items.map(i=>({id:uid(),text:i.text,done:false}))};S.lists.push(c);save();view={name:'edit',id:c.id};render();const f=document.getElementById('lname');f.focus();f.select();return}
  if(t.id==='dellist'){
    if(armed!=='list'){armed='list';t.classList.add('armed');t.textContent='Vajuta uuesti kustutamiseks';return}
    S.lists=S.lists.filter(l=>l.id!==view.id);save();view={name:'home'};return render()}
  if(t.id==='copybk'){const ta=document.getElementById('bk');
    const done=()=>{t.textContent='Kopeeritud ✓'};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.focus();ta.select()})}catch(err){ta.focus();ta.select()}return}
  if(t.id==='restore'){const msg=document.getElementById('msg');
    let d;try{d=JSON.parse(document.getElementById('rs').value)}catch(err){}
    if(!d||!Array.isArray(d.lists)){msg.textContent='See tekst ei ole Kõik kaasas varukoopia. Kopeeri kogu tekst uuesti.';return}
    if(armed!=='restore'){armed='restore';t.classList.add('armed');t.textContent='Vajuta uuesti: praegused nimekirjad asendatakse';return}
    S=d;save();view={name:'home'};return render()}
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='addf'){const v=document.getElementById('newitem').value.trim();if(!v)return;syncEdit();L(view.id).items.push({id:uid(),text:v,done:false});save();render();document.getElementById('newitem').focus()}
  if(e.target.id==='newf'){const v=document.getElementById('newname').value.trim();if(!v)return;const l={id:uid(),name:v,fav:false,items:[]};S.lists.push(l);save();view={name:'edit',id:l.id};render();document.getElementById('newitem').focus()}
});
app.addEventListener('change',e=>{if(view.name==='edit'&&e.target.matches('input[type=text]')&&e.target.id!=='newitem'){syncEdit();save()}});
render();
</script>

</body>
</html>
